<!DOCTYPE html>
<html data-version="0.0.154" lang="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exclusive Prize</title>

  <script>
    var APP_CONFIG = {
      "domain": "https://jup9.com",
      "mainExit_currentTab_zoneId": 10536647,
      "tabUnderClick_zoneId": 10576300,
      "back_zoneId": 10536649,
      "back_count": 10,
      "autoexit_zoneId": 10536648,
      "autoexit_timeToRedirect": 90
    };
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at center, #2e1a54 0%, #050505 100%);
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
    }

    .screen { display: none; min-height: 100svh; }
    .screen.active { display: block; }

    .v2-wrap {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .v2 { width: min(450px, 100%); transform: translateY(-20px); }

    h1 {
      font-size: clamp(34px, 10.5vw, 48px);
      font-weight: 900;
      margin: 0;
      text-transform: uppercase;
      line-height: .95;
      background: linear-gradient(180deg, #FFF192 0%, #FFCA28 50%, #D09600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
    }

    .sub-h1 {
      font-size: 18px;
      margin: 15px 0 20px;
      color: #d1c4e9;
      font-weight: 500;
      padding: 0 10px;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px); }
      25% { transform: translate(-1px, -2px); }
      50% { transform: translate(1px, 2px); }
      75% { transform: translate(-1px, 1px); }
      100% { transform: translate(1px, -1px); }
    }

    .timer-box {
      font-size: 34px;
      font-weight: 900;
      color: #ff4444;
      margin-bottom: 25px;
      background: rgba(0,0,0,0.4);
      display: inline-block;
      padding: 8px 35px;
      border-radius: 12px;
      border: 2px solid #ff4444;
      box-shadow: 0 0 20px rgba(255,68,68,0.2);
      min-height: 58px;
      animation: shake 0.5s infinite;
    }

    .v2-single-chest {
      position: relative;
      width: 80%;
      margin: 0 auto;
      transition: all .4s ease;
    }

    .v2-img img {
      width: 100%;
      height: auto;
      animation: float 2.5s infinite ease-in-out;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .hand-pointer {
      position: absolute;
      top: 50%;
      font-size: 70px;
      pointer-events: none;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
      user-select: none;
    }

    .hand-left {
      left: -50px;
      transform: translateY(-50%) rotate(90deg);
      animation: pokeR .5s infinite alternate;
    }

    .hand-right {
      right: -50px;
      transform: translateY(-50%) rotate(-90deg) scaleX(-1);
      animation: pokeL .5s infinite alternate;
    }

    @keyframes pokeR { to { transform: translateY(-50%) rotate(90deg) translateX(20px); } }
    @keyframes pokeL { to { transform: translateY(-50%) rotate(-90deg) scaleX(-1) translateX(-20px); } }

    .v2-hint {
      margin: 20px 0;
      font-size: 24px;
      font-weight: 900;
      color: #ffca28;
      text-shadow: 0 0 15px rgba(255,202,40,.5);
    }

    .final-top {
      margin-bottom: 25px;
      padding: 25px 15px;
      border-radius: 20px;
      background: rgba(255,255,255,.05);
      border: 2px solid #ffca28;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,.7);
    }

    .final-top__title {
      font-size: 32px;
      font-weight: 900;
      color: #ffca28;
      text-transform: uppercase;
    }

    .v2-panel {
      position: fixed;
      bottom: 30px;
      left: 15px;
      right: 15px;
      display: none;
    }

    .v2-panel.show { display: block; }

    .game__button {
      width: 100%;
      padding: 28px 20px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
      font-weight: 900;
      font-size: clamp(22px, 6vw, 30px);
      color: #000;
      text-transform: uppercase;
      box-shadow: 0 12px 0 #b36200, 0 20px 40px rgba(0,0,0,.5);
      cursor: pointer;
    }

    .left-pill {
      font-size: 15px;
      font-weight: 800;
      background: rgba(0,0,0,.3);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<div id="firstScreen" class="screen active">
  <div class="v2-wrap">
    <div class="v2">
      <h1 id="txt-h1"></h1>
      <div class="sub-h1" id="txt-sub"></div>

      <div class="timer-box"><span id="timer">00:15</span></div>

      <div class="v2-single-chest" id="chestSection">
        <div class="v2-img">
          <img id="chestImg"
               src="assets/images/chest-v2.webp"
               data-closed="assets/images/chest-v2.webp"
               data-open="assets/images/treasure-chest-open.webp"
               alt="Chest">
        </div>
        <div class="hand-pointer hand-left">👆</div>
        <div class="hand-pointer hand-right">👆</div>
      </div>

      <div class="v2-hint" id="v2Hint"></div>
      <div class="left-pill"><span id="txt-left"></span> <b>12</b></div>
    </div>
  </div>
</div>

<div id="finalScreen" class="screen">
  <div class="v2-wrap">
    <div class="v2">
      <div class="final-top">
        <div id="finalTopTitle" class="final-top__title"></div>
        <div id="finalTopSub"></div>
      </div>

      <div class="v2-single-chest">
        <div class="v2-img">
          <img id="finalChestImg" src="assets/images/chest-v2.webp" alt="Chest">
        </div>
      </div>
    </div>
  </div>
</div>

<div class="v2-panel" id="v2Panel">
  <button class="game__button" id="claimBtn">Открыть сундук</button>
</div>

<script>
(function () {
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])
    );
  }

  const els = {
    first: document.getElementById("firstScreen"),
    final: document.getElementById("finalScreen"),
    chest: document.getElementById("chestSection"),
    chestImg: document.getElementById("chestImg"),
    finalChestImg: document.getElementById("finalChestImg"),
    timer: document.getElementById("timer"),
    h1: document.getElementById("txt-h1"),
    sub: document.getElementById("txt-sub"),
    hint: document.getElementById("v2Hint"),
    left: document.getElementById("txt-left"),
    fTitle: document.getElementById("finalTopTitle"),
    fSub: document.getElementById("finalTopSub"),
    btn: document.getElementById("claimBtn"),
    panel: document.getElementById("v2Panel")
  };

  const lang = {
    h1: "🎁 Секретный бонус внутри",
    sub: "Сундук исчезнет, если не открыть",
    hint: "Нажми, пока не пропал",
    winTitle: "🎁 Сундук открыт",
    winSub: "Остался один шаг",
    lostTitle: "⚠️ Почти успел",
    lostSub: "Сундук ещё можно открыть",
    lostHint: "Нажми прямо сейчас",
    btn: "Открыть сундук",
    left: "Активные бонусы:"
  };

  let timeLeft = 15;

  function goFinal(isWin) {
    els.finalChestImg.src = isWin
      ? els.chestImg.dataset.open
      : els.chestImg.dataset.closed;

    els.fTitle.textContent = isWin ? lang.winTitle : lang.lostTitle;

    if (isWin) {
      els.fSub.textContent = lang.winSub;
    } else {
      els.fSub.innerHTML =
        escapeHtml(lang.lostSub) +
        "<br><span style='opacity:.95'>" +
        escapeHtml(lang.lostHint) +
        "</span>";
    }

    els.first.classList.remove("active");
    els.final.classList.add("active");
    els.panel.classList.add("show");
    els.btn.textContent = lang.btn;
  }

  els.h1.textContent = lang.h1;
  els.sub.textContent = lang.sub;
  els.hint.textContent = lang.hint;
  els.left.textContent = lang.left;

  const t = setInterval(() => {
    timeLeft--;
    els.timer.textContent = `00:${timeLeft < 10 ? "0"+timeLeft : timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(t);
      goFinal(false);
    }
  }, 1000);
})();
</script>

</body>
</html>
