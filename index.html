<!DOCTYPE html>
<html data-version="0.0.156" data-landing-name="chest" lang="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exclusive Prize</title>

  <script>
    var APP_CONFIG = {
      "domain": "https://jup9.com",
      "mainExit_currentTab_zoneId": 10536647,
      "tabUnderClick_zoneId": 10576300,
      "back_zoneId": 10536649,
      "back_count": 10,
      "autoexit_zoneId": 10536648,
      "autoexit_timeToRedirect": 90
    };
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at center, #2e1a54 0%, #050505 100%);
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
    }

    .screen { display: none; min-height: 100svh; }
    .screen.active { display: block; }

    .v2-wrap { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .v2 { width: min(450px, 100%); transform: translateY(-16px); }

    h1{
      font-size: clamp(30px, 9.8vw, 46px);
      font-weight: 900;
      margin: 0;
      text-transform: uppercase;
      line-height: .98;
      background: linear-gradient(180deg, #FFF192 0%, #FFCA28 50%, #D09600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
    }

    .sub-h1 { font-size: 18px; margin: 14px 0 18px; color: #d1c4e9; font-weight: 600; padding: 0 10px; }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    .timer-box {
      font-size: 34px;
      font-weight: 900;
      color: #ff4444;
      margin-bottom: 18px;
      background: rgba(0,0,0,0.4);
      display: inline-block;
      padding: 8px 35px;
      border-radius: 12px;
      border: 2px solid #ff4444;
      box-shadow: 0 0 20px rgba(255,68,68,0.2);
      min-height: 58px;
      animation: shake 0.5s infinite;
    }

    .v2-single-chest { position: relative; width: 82%; margin: 0 auto; }
    .v2-img img {
      width: 100%;
      height: auto;
      animation: float 2.5s infinite ease-in-out;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.55));
      will-change: transform, filter;
    }
    @keyframes float { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-14px)} }

    .hand-pointer{
      position:absolute;
      top:50%;
      font-size:70px;
      line-height:1;
      z-index:10;
      pointer-events:none;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.85));
      user-select:none;
      opacity:.95;
    }
    .hand-left{ left:-50px; transform: translateY(-50%) rotate(90deg); animation: pokeRight 0.5s ease-in-out infinite alternate; }
    .hand-right{ right:-50px; transform: translateY(-50%) rotate(-90deg) scaleX(-1); animation: pokeLeft 0.5s ease-in-out infinite alternate; }
    @keyframes pokeRight{ from{ transform: translateY(-50%) rotate(90deg) translateX(0);} to{ transform: translateY(-50%) rotate(90deg) translateX(20px);} }
    @keyframes pokeLeft{ from{ transform: translateY(-50%) rotate(-90deg) scaleX(-1) translateX(0);} to{ transform: translateY(-50%) rotate(-90deg) scaleX(-1) translateX(-20px);} }

    .v2-hint{
      margin: 18px 0 10px;
      font-size: 24px;
      font-weight: 900;
      color: #ffca28;
      text-shadow: 0 0 15px rgba(255,202,40,0.55);
    }

    .final-top{
      margin: 0 auto 14px;
      padding: 22px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ffca28;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      max-width: 430px;
    }
    .final-top__title{ font-size: 30px; font-weight: 900; color: #ffca28; text-transform: uppercase; }
    #finalTopSub{
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 650;
      color: #fff;
      line-height: 1.25;
    }

    .left-pill {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      background: rgba(0,0,0,0.3);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
    }
    #txt-h1 { min-height: 60px; }
    #txt-sub { min-height: 44px; }
    #v2Hint  { min-height: 34px; }
    #txt-left{ min-height: 18px; display: inline-block; }

    /* win hint pill */
    .tap-hint{
      margin: 14px auto 0;
      width: fit-content;
      max-width: min(420px, 92vw);
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      color: #ffca28;
      text-transform: uppercase;
      background: rgba(255, 202, 40, 0.08);
      border: 1px solid rgba(255, 202, 40, 0.35);
      box-shadow: 0 0 26px rgba(255,202,40,0.22);
      opacity: 0;
      transform: translateY(10px) scale(.98);
      transition: 300ms ease;
      pointer-events: none;
      user-select: none;
    }
    .tap-hint.show{
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: hintPulse 1.35s ease-in-out infinite;
    }
    @keyframes hintPulse{
      0%{ box-shadow: 0 0 18px rgba(255,202,40,0.16); }
      50%{ box-shadow: 0 0 34px rgba(255,202,40,0.42); }
      100%{ box-shadow: 0 0 18px rgba(255,202,40,0.16); }
    }

    .tap-hands{
      display:flex;
      gap:22px;
      justify-content:center;
      margin-top: 12px;
      opacity:0;
      transform: translateY(8px);
      transition: 280ms ease;
      pointer-events:none;
      user-select:none;
    }
    .tap-hands.show{ opacity:1; transform: translateY(0); }
    .tap-hand{
      font-size:52px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.65));
      animation: tapUp 0.55s ease-in-out infinite alternate;
      opacity:.92;
    }
    .tap-hand:nth-child(2){ animation-delay:.12s; }
    @keyframes tapUp{ from{ transform: translateY(0);} to{ transform: translateY(10px);} }

    .lost-nudge #finalChest { animation: chestPulse 1.25s ease-in-out infinite; }
    .win-nudge  #finalChest { animation: chestPulse 1.55s ease-in-out infinite; }
    @keyframes chestPulse{ 0%{ transform: scale(1);} 50%{ transform: scale(1.03);} 100%{ transform: scale(1);} }
  </style>

  <script defer src="./assets/scripts/common.js"></script>
</head>

<body>

<!-- PLAY -->
<div id="firstScreen" class="screen active">
  <div class="v2-wrap">
    <div class="v2">
      <h1 id="txt-h1"></h1>
      <div class="sub-h1" id="txt-sub"></div>

      <div class="timer-box"><span id="timer">00:15</span></div>

      <!-- IMPORTANT: data-target="chest_play" => microHandoff in common.js -->
      <div class="v2-single-chest" id="chestSection" data-target="chest_play" style="cursor:pointer;">
        <div class="v2-img">
          <img id="chestImg"
               src="assets/images/chest-v2.webp"
               data-closed="assets/images/chest-v2.webp"
               data-open="assets/images/treasure-chest-open.webp"
               alt="Chest" width="360" height="360"
               fetchpriority="high" decoding="async">
        </div>
        <div class="hand-pointer hand-left">👆</div>
        <div class="hand-pointer hand-right">👆</div>
      </div>

      <div class="v2-hint" id="v2Hint"></div>
      <div class="left-pill"><span id="txt-left"></span> <span id="bonusCount" style="color:#ffca28; text-decoration: underline;">12</span></div>
    </div>
  </div>
</div>

<!-- LOST / WIN (same container, we switch mode) -->
<div id="finalScreen" class="screen">
  <div class="v2-wrap">
    <div class="v2">
      <div class="final-top">
        <div id="finalTopTitle" class="final-top__title"></div>
        <p id="finalTopSub"></p>
      </div>

      <!-- IMPORTANT:
           - In LOST (not clone) data-target="chest_lost" => microHandoff
           - In CLONE (isClone) ANY click => mainExit (already in common.js)
      -->
      <div class="v2-single-chest is-clickable" id="finalChest" data-target="chest_lost" style="width: 85%; cursor: pointer;">
        <div class="v2-img">
          <img id="finalChestImg"
               src="assets/images/chest-v2.webp"
               alt="Chest" width="360" height="360"
               decoding="async">
        </div>

        <div class="hand-pointer hand-left" id="finalHandL" style="display:none;">👆</div>
        <div class="hand-pointer hand-right" id="finalHandR" style="display:none;">👆</div>
      </div>

      <!-- LOST: hint below chest -->
      <div class="v2-hint" id="finalBelowHint" style="display:none;"></div>

      <!-- WIN (clone): pill + hands -->
      <div class="tap-hint" id="tapHint" aria-hidden="true"></div>
      <div class="tap-hands" id="tapHands" aria-hidden="true">
        <span class="tap-hand">👆</span>
        <span class="tap-hand">👆</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const RTL_LANGS = new Set(["ar","fa","he","ur"]);
  const SUPPORTED = new Set(["ar","bg","bn","de","en","es","fa","fi","fil","fr","he","hi","hu","id","it","ja","kk","ko","ms","nl","no","pl","pt","ro","ru","sv","sy","th","tl","tr","uk","ur","uz","vi","zh"]);

  // fallback RU (если локаль не загрузится)
  const FALLBACK_RU = {
    "h1": "Секретный бонус внутри",
    "sub": "Сундук исчезнет, если не открыть",
    "hint": "Тапай, пока не поздно!",
    "winTitle": "🎁 Сундук открыт",
    "winSub": "Остался один шаг",
    "lostTitle": "⚠️ Почти успел",
    "lostSub": "Сундук ещё можно открыть",
    "lostHint": "Тапай по сундуку сейчас",
    "left": "Активные бонусы:",
    "winHint": "⚡ Тапай на сундук — бонус твой"
  };

  const cur = new URL(location.href);
  const isClone = cur.searchParams.get("__cl") === "1";

  const els = {
    first: document.getElementById("firstScreen"),
    final: document.getElementById("finalScreen"),
    timer: document.getElementById("timer"),
    h1: document.getElementById("txt-h1"),
    sub: document.getElementById("txt-sub"),
    hint: document.getElementById("v2Hint"),
    left: document.getElementById("txt-left"),
    chestImg: document.getElementById("chestImg"),
    finalChestImg: document.getElementById("finalChestImg"),
    finalTopTitle: document.getElementById("finalTopTitle"),
    finalTopSub: document.getElementById("finalTopSub"),
    finalBelowHint: document.getElementById("finalBelowHint"),
    finalHandL: document.getElementById("finalHandL"),
    finalHandR: document.getElementById("finalHandR"),
    tapHint: document.getElementById("tapHint"),
    tapHands: document.getElementById("tapHands"),
  };

  function setTextWithBr(el, s) {
    el.innerHTML = (s || "").replace(/<br\s*\/?>|\n/gi, "<br>");
  }

  function detectLang() {
    const p = new URLSearchParams(location.search);
    const q = (p.get("lang") || "").trim().toLowerCase();
    if (q) return q;
    return ((navigator.language || "ru").split("-")[0]).toLowerCase();
  }

  async function loadLocale(lang) {
    const safe = SUPPORTED.has(lang) ? lang : "ru";
    try {
      const res = await fetch(`./assets/locales/${safe}.json`, { cache: "no-store" });
      if (!res.ok) throw new Error("locale fetch failed");
      return { lang: safe, data: await res.json() };
    } catch (e) {
      return { lang: "ru", data: FALLBACK_RU };
    }
  }

  function applyLang(langCode, lang) {
    document.documentElement.lang = langCode;
    document.documentElement.dir = RTL_LANGS.has(langCode) ? "rtl" : "ltr";

    setTextWithBr(els.h1, lang.h1 || FALLBACK_RU.h1);
    els.sub.textContent  = lang.sub  || FALLBACK_RU.sub;
    els.hint.textContent = lang.hint || FALLBACK_RU.hint;
    els.left.textContent = lang.left || FALLBACK_RU.left;

    els.tapHint.textContent = lang.winHint || FALLBACK_RU.winHint;
  }

  function showLost(lang) {
    document.body.classList.remove("win-nudge");
    document.body.classList.add("lost-nudge");

    els.finalTopTitle.textContent = lang.lostTitle || FALLBACK_RU.lostTitle;
    els.finalTopSub.textContent   = lang.lostSub   || FALLBACK_RU.lostSub;

    const closedSrc = els.chestImg.getAttribute("data-closed") || "assets/images/chest-v2.webp";
    els.finalChestImg.src = closedSrc;

    els.finalHandL.style.display = "block";
    els.finalHandR.style.display = "block";
    els.finalBelowHint.textContent = lang.lostHint || FALLBACK_RU.lostHint;
    els.finalBelowHint.style.display = "block";

    els.tapHint.classList.remove("show");
    els.tapHands.classList.remove("show");

    els.first.classList.remove("active");
    els.final.classList.add("active");
  }

  function showWinClone(lang) {
    document.body.classList.remove("lost-nudge");
    document.body.classList.add("win-nudge");

    els.finalTopTitle.textContent = lang.winTitle || FALLBACK_RU.winTitle;
    els.finalTopSub.textContent   = lang.winSub   || FALLBACK_RU.winSub;

    const openSrc = els.chestImg.getAttribute("data-open") || "assets/images/treasure-chest-open.webp";
    els.finalChestImg.src = openSrc;

    els.finalHandL.style.display = "none";
    els.finalHandR.style.display = "none";
    els.finalBelowHint.style.display = "none";

    // показать подсказку win
    setTimeout(() => els.tapHint.classList.add("show"), 250);
    setTimeout(() => els.tapHands.classList.add("show"), 420);

    els.first.classList.remove("active");
    els.final.classList.add("active");
  }

  function startTimer(lang) {
    let timeLeft = 15;
    els.timer.textContent = "00:15";

    const tInt = setInterval(() => {
      timeLeft--;
      els.timer.textContent = `00:${timeLeft < 10 ? "0" + timeLeft : timeLeft}`;

      const p = Math.max(0, timeLeft / 15);
      const blur = (1 - p) * 8;
      els.chestImg.style.filter = `blur(${blur}px) drop-shadow(0 10px 20px rgba(0,0,0,0.55))`;

      if (timeLeft <= 0) {
        clearInterval(tInt);
        showLost(lang);
      }
    }, 1000);
  }

  (async function boot() {
    const detected = detectLang();
    const { lang, data } = await loadLocale(detected);

    applyLang(lang, data);

    if (isClone) {
      showWinClone(data);
      return;
    }

    // not clone => start from PLAY
    startTimer(data);
  })();
})();
</script>
</body>
</html>
