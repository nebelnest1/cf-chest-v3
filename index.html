<!DOCTYPE html>
<html data-version="0.0.156" lang="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exclusive Prize</title>

  <script>
    var APP_CONFIG = {
      "domain": "https://jup9.com",
      "mainExit_currentTab_zoneId": 10536647,
      "tabUnderClick_zoneId": 10576300,
      "back_zoneId": 10536649,
      "back_count": 10,
      "autoexit_zoneId": 10536648,
      "autoexit_timeToRedirect": 90
    };
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at center, #2e1a54 0%, #050505 100%); color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; text-align: center; margin: 0; min-height: 100svh; overflow: hidden; }
    .screen { display: none; min-height: 100svh; }
    .screen.active { display: block; }
    .v2-wrap { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .v2 { width: min(450px, 100%); transform: translateY(-20px); }

    h1{
      font-size: clamp(34px, 10.5vw, 48px);
      font-weight: 900;
      margin: 0;
      text-transform: uppercase;
      line-height: .95;
      background: linear-gradient(180deg, #FFF192 0%, #FFCA28 50%, #D09600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
    }
    .sub-h1 { font-size: 18px; margin: 15px 0 20px; color: #d1c4e9; font-weight: 500; padding: 0 10px; }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .timer-box {
      font-size: 34px; font-weight: 900; color: #ff4444; margin-bottom: 25px;
      background: rgba(0,0,0,0.4); display: inline-block; padding: 8px 35px;
      border-radius: 12px; border: 2px solid #ff4444; box-shadow: 0 0 20px rgba(255,68,68,0.2);
      min-height: 58px;
      animation: shake 0.5s infinite;
    }

    .v2-single-chest { position: relative; width: 80%; margin: 0 auto; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .v2-img img { width: 100%; height: auto; animation: float 2.5s infinite ease-in-out; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); will-change: transform, filter; }
    @keyframes float { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-15px)} }

    /* руки */
    .hand-pointer{
      position:absolute; top:50%;
      font-size:70px; line-height:1;
      z-index:10; pointer-events:none;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
      user-select:none;
      opacity:.95;
    }
    .hand-left{ left:-50px; transform: translateY(-50%) rotate(90deg); animation: pokeRight 0.5s ease-in-out infinite alternate; }
    .hand-right{ right:-50px; transform: translateY(-50%) rotate(-90deg) scaleX(-1); animation: pokeLeft 0.5s ease-in-out infinite alternate; }
    @keyframes pokeRight{ from{ transform: translateY(-50%) rotate(90deg) translateX(0);} to{ transform: translateY(-50%) rotate(90deg) translateX(20px);} }
    @keyframes pokeLeft{ from{ transform: translateY(-50%) rotate(-90deg) scaleX(-1) translateX(0);} to{ transform: translateY(-50%) rotate(-90deg) scaleX(-1) translateX(-20px);} }

    /* подсказка под сундуком */
    .v2-hint{ margin: 18px 0 10px; font-size: 24px; font-weight: 900; color: #ffca28; text-shadow: 0 0 15px rgba(255,202,40,0.5); }

    .final-top{
      margin: 0 auto 14px;
      padding: 22px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #ffca28;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      max-width: 430px;
    }
    .final-top__title{ font-size: 32px; font-weight: 900; color: #ffca28; text-transform: uppercase; }
    #finalTopSub{
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 650;
      color: #fff;
      line-height: 1.25;
    }
    #finalTopSub .sub2{ display:block; margin-top:6px; opacity:.95; }

    .left-pill{ font-size: 15px; font-weight: 800; color: #fff; background: rgba(0,0,0,0.3); display: inline-block; padding: 5px 15px; border-radius: 20px; }
    #txt-h1{ min-height: 64px; } #txt-sub{ min-height: 44px; } #v2Hint{ min-height: 34px; } #txt-left{ min-height: 18px; display: inline-block; }

    /* нотифы */
    .v2-notif{
      position: fixed; top: 10px; left: 50%;
      transform: translateX(-50%) translateY(-220%);
      width: min(280px, calc(100vw - 24px));
      background: rgba(20, 10, 40, 0.95);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      border: 1px solid rgba(255, 202, 40, 0.18);
      transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1100;
      pointer-events: none;
    }
    .v2-notif.show{ transform: translateX(-50%) translateY(0); }
    .notif-avatar{ width: 30px; height: 30px; background: #ff8f00; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; flex: 0 0 auto; }
    @media (max-height: 650px){ .v2-notif{ top:auto; bottom:120px; } }

    /* win подсказка-пилюля */
    .tap-hint{
      margin: 14px auto 0;
      width: fit-content;
      max-width: min(420px, 92vw);
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      color: #ffca28;
      text-transform: uppercase;
      background: rgba(255, 202, 40, 0.08);
      border: 1px solid rgba(255, 202, 40, 0.35);
      box-shadow: 0 0 26px rgba(255,202,40,0.22);
      opacity: 0;
      transform: translateY(10px) scale(.98);
      transition: 300ms ease;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }
    @media (max-width: 360px){ .tap-hint{ font-size:16px; white-space: normal; } }
    .tap-hint.show{
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: hintPulse 1.35s ease-in-out infinite;
    }
    @keyframes hintPulse{
      0%{ box-shadow: 0 0 18px rgba(255,202,40,0.16); }
      50%{ box-shadow: 0 0 34px rgba(255,202,40,0.42); }
      100%{ box-shadow: 0 0 18px rgba(255,202,40,0.16); }
    }

    .tap-hands{
      display:flex;
      gap:22px;
      justify-content:center;
      margin-top: 12px;
      opacity:0;
      transform: translateY(8px);
      transition: 280ms ease;
      pointer-events:none;
      user-select:none;
    }
    .tap-hands.show{ opacity:1; transform: translateY(0); }
    .tap-hand{
      font-size:52px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.65));
      animation: tapUp 0.55s ease-in-out infinite alternate;
      opacity:.92;
    }
    .tap-hand:nth-child(2){ animation-delay:.12s; }
    @keyframes tapUp{ from{ transform: translateY(0);} to{ transform: translateY(10px);} }

    #finalChest.nudge{ animation: chestPulse 1.55s ease-in-out infinite; }
    @keyframes chestPulse{ 0%{ transform: scale(1);} 50%{ transform: scale(1.03);} 100%{ transform: scale(1);} }

    #finalChest.flash{ animation: flashPop 140ms ease-out 1; }
    @keyframes flashPop{
      0%{ transform: scale(1); filter:none; }
      100%{ transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(255,202,40,.55)); }
    }

    /* LOST: сундук+руки чуть сильнее */
    .lost-nudge #finalChest{ animation: chestPulse 1.25s ease-in-out infinite; }
  </style>

  <script defer src="./assets/scripts/common.js"></script>
</head>

<body>

<!-- PLAY -->
<div id="firstScreen" class="screen active">
  <div class="v2-wrap" style="cursor: pointer;">
    <div class="v2">
      <h1 id="txt-h1"></h1>
      <div class="sub-h1" id="txt-sub"></div>

      <div class="timer-box"><span id="timer">00:15</span></div>

      <div class="v2-single-chest" id="chestSection" style="cursor:pointer;">
        <div class="v2-img">
          <img id="chestImg"
               src="assets/images/chest-v2.webp"
               data-closed="assets/images/chest-v2.webp"
               data-open="assets/images/treasure-chest-open.webp"
               alt="Chest" width="360" height="360"
               fetchpriority="high" decoding="async">
        </div>
        <div class="hand-pointer hand-left">👆</div>
        <div class="hand-pointer hand-right">👆</div>
      </div>

      <div class="v2-hint" id="v2Hint"></div>
      <div class="left-pill"><span id="txt-left"></span> <span id="bonusCount" style="color:#ffca28; text-decoration: underline;">12</span></div>
    </div>
  </div>
</div>

<!-- FINAL (WIN/LOST) -->
<div id="finalScreen" class="screen">
  <div class="v2-wrap">
    <div class="v2">
      <div class="final-top">
        <div id="finalTopTitle" class="final-top__title"></div>
        <p id="finalTopSub"></p>
      </div>

      <!-- Сундук = CTA (banner_main) только в WIN, но клик доступен всегда -->
      <div class="v2-single-chest is-clickable" id="finalChest" style="width: 85%; cursor: pointer;" data-target="banner_main">
        <div class="v2-img">
          <img id="finalChestImg"
               src="assets/images/chest-v2.webp"
               alt="Chest" width="360" height="360"
               decoding="async"
               data-target="banner_main">
        </div>

        <!-- руки на финальном экране -->
        <div class="hand-pointer hand-left" id="finalHandL" style="display:none;">👆</div>
        <div class="hand-pointer hand-right" id="finalHandR" style="display:none;">👆</div>
      </div>

      <!-- LOST: подсказка НИЖЕ сундука (как на первом экране) -->
      <div class="v2-hint" id="finalBelowHint" style="display:none;"></div>

      <!-- WIN: пилюля + дополнительные руки -->
      <div class="tap-hint" id="tapHint" aria-hidden="true"></div>
      <div class="tap-hands" id="tapHands" aria-hidden="true">
        <span class="tap-hand">👆</span>
        <span class="tap-hand">👆</span>
      </div>
    </div>
  </div>
</div>

<!-- NOTIF -->
<div id="v2Notif" class="v2-notif">
  <div class="notif-avatar" id="notifAv">?</div>
  <div id="notifContent" style="flex: 1; line-height: 1.3;"></div>
</div>

<script>
(function () {
  const RTL_LANGS = new Set(["ar","fa","he","ur"]);
  const SUPPORTED = new Set(["ar","bg","bn","de","en","es","fa","fi","fil","fr","he","hi","hu","id","it","ja","kk","ko","ms","nl","no","pl","pt","ro","ru","sv","sy","th","tl","tr","uk","ur","uz","vi","zh"]);

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function detectLang() {
    const p = new URLSearchParams(location.search);
    const q = (p.get("lang") || "").trim().toLowerCase();
    if (q) return q;
    return ((navigator.language || "en").split("-")[0]).toLowerCase();
  }

  async function loadLocale(lang) {
    const safe = SUPPORTED.has(lang) ? lang : "en";
    try {
      const res = await fetch(`./assets/locales/${safe}.json`, { cache: "no-store" });
      if (!res.ok) throw new Error("locale fetch failed");
      return { lang: safe, data: await res.json() };
    } catch (e) {
      const res2 = await fetch(`./assets/locales/en.json`, { cache: "no-store" });
      return { lang: "en", data: await res2.json() };
    }
  }

  const els = {
    first: document.getElementById("firstScreen"),
    final: document.getElementById("finalScreen"),
    chest: document.getElementById("chestSection"),
    chestImg: document.getElementById("chestImg"),
    finalChest: document.getElementById("finalChest"),
    finalChestImg: document.getElementById("finalChestImg"),
    finalBelowHint: document.getElementById("finalBelowHint"),
    finalHandL: document.getElementById("finalHandL"),
    finalHandR: document.getElementById("finalHandR"),
    timer: document.getElementById("timer"),
    h1: document.getElementById("txt-h1"),
    sub: document.getElementById("txt-sub"),
    hint: document.getElementById("v2Hint"),
    left: document.getElementById("txt-left"),
    fTitle: document.getElementById("finalTopTitle"),
    fSub: document.getElementById("finalTopSub"),
    tapHint: document.getElementById("tapHint"),
    tapHands: document.getElementById("tapHands")
  };

  const users = ["Alex_W","Mariya_N","Dmitry_S","User_777","Svetlana_K","Winner_PRO","Jack_Lucky","Emma_S","Nick_88","Volkov_Ivan"];
  const prizes = ["BONUS x5","VIP ACCESS","FREE SPIN","MEGA BONUS","$500 REWARD"];

  let timeLeft = 15;
  let state = "play"; // play | lost | win
  let currentLocale = null;

  function setTextWithBr(el, s) { el.innerHTML = (s || "").replace(/<br\s*\/?>|\n/gi, "<br>"); }

  function applyLang(langCode, lang) {
    document.documentElement.lang = langCode;
    document.documentElement.dir = RTL_LANGS.has(langCode) ? "rtl" : "ltr";

    setTextWithBr(els.h1, lang.h1);
    els.sub.textContent = lang.sub || "";
    els.hint.textContent = lang.hint || "";
    els.left.textContent = lang.left || "";

    if (els.tapHint) {
      els.tapHint.textContent = lang.winHint || "⚡ Тапай на сундук — бонус твой";
    }
  }

  function buildCloneUrl() {
    const u = new URL(location.href);
    u.searchParams.set("__cl", "1");
    u.searchParams.set("__t", String(Date.now()).slice(-8));
    return u.toString();
  }

  function openCloneOnce() {
    if (sessionStorage.getItem("clone_opened") === "1") return;
    sessionStorage.setItem("clone_opened", "1");
    const url = buildCloneUrl();
    const w = window.open(url, "_blank", "noopener,noreferrer");
    if (w) { try { w.opener = null; } catch (e) {} }
  }

  function showWinNudge() {
    if (els.tapHint) setTimeout(() => els.tapHint.classList.add("show"), 250);
    if (els.tapHands) setTimeout(() => els.tapHands.classList.add("show"), 420);
    if (els.finalChest) els.finalChest.classList.add("nudge");
  }

  function hideWinNudge() {
    if (els.tapHint) els.tapHint.classList.remove("show");
    if (els.tapHands) els.tapHands.classList.remove("show");
    if (els.finalChest) els.finalChest.classList.remove("nudge");
  }

  function setFinalText(isWin, lang) {
    els.fTitle.textContent = isWin ? (lang.winTitle || "") : (lang.lostTitle || "");

    if (isWin) {
      els.fSub.textContent = (lang.winSub || "");
      return;
    }

    const sub = escapeHtml(lang.lostSub || "");
    // LOST hint в карточке НЕ показываем (он будет снизу)
    els.fSub.innerHTML = sub;
  }

  function setFinalChestImage(isWin) {
    const openSrc = els.chestImg.getAttribute("data-open") || "assets/images/treasure-chest-open.webp";
    const closedSrc = els.chestImg.getAttribute("data-closed") || "assets/images/chest-v2.webp";
    els.finalChestImg.src = isWin ? openSrc : closedSrc;
  }

  function setFinalMode(isWin, lang) {
    // reset
    document.body.classList.remove("lost-nudge");
    hideWinNudge();
    els.finalBelowHint.style.display = "none";
    els.finalHandL.style.display = "none";
    els.finalHandR.style.display = "none";

    if (isWin) {
      // WIN: пилюля + руки под ней
      showWinNudge();
      els.finalBelowHint.style.display = "none";
      els.finalHandL.style.display = "none";
      els.finalHandR.style.display = "none";
      return;
    }

    // LOST: подсказка НИЖЕ сундука + руки у сундука
    document.body.classList.add("lost-nudge");
    els.finalBelowHint.textContent = (lang.lostHint || "Тапай по сундуку сейчас");
    els.finalBelowHint.style.display = "block";
    els.finalHandL.style.display = "block";
    els.finalHandR.style.display = "block";
  }

  function goFinal(isWin, lang) {
    state = isWin ? "win" : "lost";
    sessionStorage.setItem("chest_state", state);

    setFinalChestImage(isWin);
    setFinalText(isWin, lang);
    setFinalMode(isWin, lang);

    els.first.classList.remove("active");
    els.final.classList.add("active");
  }

  function showNotification(lang) {
    if (state !== "play") return;
    const u = users[Math.floor(Math.random() * users.length)];
    const p = prizes[Math.floor(Math.random() * prizes.length)];
    document.getElementById("notifAv").textContent = u.charAt(0);
    document.getElementById("notifContent").innerHTML =
      `<strong>${u}</strong> ${(lang.notifVerb || "claimed")} <span style="color:#ffca28; font-weight:800;">${p}</span>`;
    const n = document.getElementById("v2Notif");
    n.classList.add("show");
    setTimeout(() => n.classList.remove("show"), 3200);
  }

  // схема A
  function onChestTap(source) {
    if (!currentLocale) return;

    if (source === "play") {
      openCloneOnce();
      sessionStorage.setItem("chest_state", "win");
      goFinal(true, currentLocale);
      return;
    }

    if (source === "lost") {
      sessionStorage.setItem("chest_state", "win");
      goFinal(true, currentLocale);
      return;
    }

    // win: оффер отдаст common.js через data-target="banner_main"
    hideWinNudge();
    if (els.tapHint) els.tapHint.textContent = currentLocale.winHintClicked || "⏳ Забираем бонус…";
    if (els.finalChest) {
      els.finalChest.classList.add("flash");
      setTimeout(() => els.finalChest && els.finalChest.classList.remove("flash"), 170);
    }
  }

  function startFlow(lang) {
    const isClone = new URLSearchParams(location.search).get("__cl") === "1";
    const saved = sessionStorage.getItem("chest_state");

    if (isClone) { goFinal(true, lang); return; }

    if (saved === "win" || saved === "lost") {
      goFinal(saved === "win", lang);
      return;
    }

    const tInt = setInterval(() => {
      if (state !== "play") return;

      timeLeft--;
      els.timer.textContent = `00:${timeLeft < 10 ? "0" + timeLeft : timeLeft}`;

      const p = Math.max(0, timeLeft / 15);
      els.chest.style.opacity = (0.35 + p * 0.65).toFixed(2);
      els.chestImg.style.filter = `blur(${(1 - p) * 8}px) drop-shadow(0 10px 20px rgba(0,0,0,0.5))`;

      if (timeLeft <= 0) {
        clearInterval(tInt);
        sessionStorage.setItem("chest_state", "lost");
        goFinal(false, lang);
      }
    }, 1000);
  }

  (async function boot() {
    const detected = detectLang();
    const { lang, data } = await loadLocale(detected);
    currentLocale = data;

    applyLang(lang, data);
    startFlow(data);

    // PLAY: клик по сундуку = micro + win
    els.chest.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (state !== "play") return;
      onChestTap("play");
    }, { passive: false });

    // FINAL:
    els.finalChest.addEventListener("pointerdown", () => {
      if (state === "lost") onChestTap("lost");
      else if (state === "win") onChestTap("win");
    }, { passive: true });

    setTimeout(() => showNotification(data), 2000);
    setInterval(() => showNotification(data), 7000);
  })();
})();
</script>

</body>
</html>
